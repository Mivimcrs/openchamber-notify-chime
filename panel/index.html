<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>提示音</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--oc-font, system-ui, "Microsoft YaHei", sans-serif);
    font-size: 0.8125rem;
    line-height: 1.5;
    color: var(--oc-fg, inherit);
    background: transparent;
    padding: 10px 12px 16px;
  }

  #root { display: flex; flex-direction: column; gap: 14px; }

  /* header */
  .nc-head { display: flex; align-items: flex-start; gap: 10px; }
  .nc-titles { flex: 1 1 auto; min-width: 0; }
  .nc-title { font-size: 0.9375rem; font-weight: 600; letter-spacing: 0.01em; }
  .nc-sub { margin-top: 2px; color: var(--oc-muted, #888); font-size: 0.75rem; }
  .nc-master { flex: 0 0 auto; padding-top: 1px; }

  /* banner */
  .nc-banner { display: none; }
  .nc-banner[data-show="true"] {
    display: block;
    padding: 8px 10px;
    border-radius: var(--oc-radius, 8px);
    border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.28));
    background: var(--oc-elevated, rgba(128, 128, 128, 0.08));
    font-size: 0.75rem;
  }
  .nc-banner[data-tone="error"] {
    border-color: var(--oc-error, #c0392b);
    background: color-mix(in srgb, var(--oc-error, #c0392b) 12%, transparent);
  }
  .nc-banner-text { font-weight: 600; }
  .nc-banner-body { margin-top: 2px; color: var(--oc-muted, #888); overflow-wrap: anywhere; }
  .nc-banner-action { margin-top: 8px; }

  /* sections */
  .nc-section {
    padding: 10px;
    border-radius: var(--oc-radius, 8px);
    border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.22));
    background: var(--oc-elevated, rgba(128, 128, 128, 0.06));
  }
  .nc-section-title {
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--oc-muted, #888);
    margin-bottom: 8px;
  }

  /* one event row */
  .nc-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 0;
    border-top: 1px solid var(--oc-border, rgba(128, 128, 128, 0.16));
  }
  .nc-section > .nc-row:nth-of-type(2) { border-top: none; padding-top: 0; }
  .nc-row:last-of-type { padding-bottom: 0; }
  .nc-row-name { font-weight: 600; }
  .nc-row-meta {
    color: var(--oc-muted, #888);
    font-size: 0.6875rem;
    overflow-wrap: anywhere;
  }
  .nc-row[data-broken="true"] .nc-row-name { color: var(--oc-error-text, #c0392b); }
  .nc-row[data-broken="true"] .nc-row-meta { color: var(--oc-error-text, #c0392b); }

  .nc-row-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .nc-row-controls > .oc-sdk-select { flex: 1 1 120px; min-width: 110px; }
  .nc-row-controls > .oc-sdk-check { flex: 0 0 auto; }

  /* volume + import */
  .nc-volume-control { display: flex; }
  .nc-volume-control > .oc-sdk-select { flex: 1 1 auto; }

  .nc-import {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px;
    align-items: start;
  }
  .nc-import-slot { grid-column: 1 / -1; }
  .nc-import-slot > .oc-sdk-select { width: 100%; }
  .nc-import-path { min-width: 0; }
  .nc-import-go { padding-top: 1px; }
  .nc-hint {
    margin-top: 6px;
    color: var(--oc-muted, #888);
    font-size: 0.6875rem;
  }

  /* recent */
  .nc-recent { display: flex; flex-direction: column; gap: 3px; }
  .nc-log {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 0.6875rem;
    color: var(--oc-muted, #888);
  }
  .nc-log-time {
    flex: 0 0 auto;
    font-family: var(--oc-mono, ui-monospace, Consolas, monospace);
    font-variant-numeric: tabular-nums;
    opacity: 0.8;
  }
  .nc-log-what { min-width: 0; overflow-wrap: anywhere; }
  .nc-empty { color: var(--oc-muted, #888); font-size: 0.6875rem; }

  .nc-foot {
    color: var(--oc-muted, #888);
    font-size: 0.625rem;
    overflow-wrap: anywhere;
  }

  /* service unreachable (not approved yet) */
  .nc-notice {
    padding: 12px;
    border-radius: var(--oc-radius, 8px);
    border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.28));
    background: var(--oc-elevated, rgba(128, 128, 128, 0.06));
  }
  .nc-notice-title { font-weight: 600; font-size: 0.875rem; }
  .nc-notice-body {
    margin-top: 4px;
    color: var(--oc-muted, #888);
    font-size: 0.75rem;
    overflow-wrap: anywhere;
  }
  .nc-notice-action { margin-top: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="./main.js"></script>
</body>
</html>
